databases:
  - name: botmaker-db
    databaseName: botmaker
    user: botmaker
    plan: free

services:
  - type: web
    name: botmaker-web
    env: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma db push && npm run build
    startCommand: node start.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: botmaker-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: "https://botmaker-web.onrender.com"
      - key: APP_URL
        value: "https://botmaker-web.onrender.com"
