databases:
  - name: botmaker-db
    databaseName: botmaker
    user: botmaker
    plan: free

services:
  - type: web
    name: botmaker-web
    env: node
    plan: free
    autoDeployTrigger: commit
    buildCommand: npm install --include=dev && npx prisma generate && node scripts/migrate-telegram-user-primary-key.js && npx prisma db push && npm run build
    startCommand: node start.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: botmaker-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: "https://botmaker-web-iu2a.onrender.com"
      - key: APP_URL
        value: "https://botmaker-web-iu2a.onrender.com"
      - key: PAYMENT_CREDENTIALS_ENCRYPTION_KEY
        generateValue: true
      - key: REDIS_URL
        value: "redis://localhost:6379"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      - key: AMPLOPAY_CLIENT_ID
        sync: false
      - key: AMPLOPAY_CLIENT_SECRET
        sync: false
      - key: SYNC_PAY_CLIENT_ID
        sync: false
      - key: SYNC_PAY_CLIENT_SECRET
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: STORAGE_PROVIDER
        value: local
      - key: STORAGE_LOCAL_PATH
        value: ./public/uploads
